<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de tareas</title>
  <link rel="stylesheet" href="form_tarea.css">
</head>
<body>
  <h1 id="titulo">Mi lista de tareas</h1>

  <div class="controles">
    <input type="text" id="tarea" placeholder="Escribe una tarea" autocomplete="off">
    <button id="anadir">Añadir tarea</button>
  </div>

  <ul id="lista"></ul>

  <div class="botones-extra">
    <button id="cambiar-titulo">Cambiar título</button>
    <button id="tema">Cambiar tema</button>
  </div>

  <script src="form_tarea.js"></script>
</body>
</html>
