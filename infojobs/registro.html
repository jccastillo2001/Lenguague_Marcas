<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta - MiEmpleo</title>
  <!-- CSS: el orden importa, base.css define las variables -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/navegacion.css">
  <link rel="stylesheet" href="css/formularios.css">
</head>
<body>
  <!-- Barra superior (se repite igual en cada página) -->
  <nav>
    <span class="logo">MiEmpleo</span>
    <a href="index.html">Inicio</a>
    <a href="login.html">Iniciar sesión</a>
    <a href="registro.html">Crear cuenta</a>
    <a href="curriculum.html">Mi currículum</a>
  </nav>

  <main>
    <div class="tarjeta">
      <h1>Crea tu cuenta</h1>
      <form id="form-registro">
        <label for="reg-nombre">Nombre</label>
        <input type="text" id="reg-nombre" required>

        <label for="reg-apellido">Primer apellido</label>
        <input type="text" id="reg-apellido" required>

        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" required>

        <label for="reg-pass">Contraseña</label>
        <input type="password" id="reg-pass" required>

        <!-- Los 3 trocitos que registro.js ilumina -->
        <div class="seguridad" id="seguridad"><span></span><span></span><span></span></div>

        <div class="check">
          <input type="checkbox" id="reg-acepto" required>
          <label for="reg-acepto">Acepto las condiciones legales y la información de privacidad</label>
        </div>

        <button type="submit">Crear cuenta</button>
      </form>
    </div>
  </main>

  <!-- JS al final del body: así el HTML ya existe cuando el código lo busca -->
  <script src="js/comun.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
